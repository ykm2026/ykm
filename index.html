function confirmImport(){
  try{
  if(!importData||importData.length<2){toast("没有可导入的数据");return}
  var mapping={};
  var fields=["group","product","planned","actual","unit","needFilm","startDate","endDate","orderType","status","notes","orderNo","model"];
  fields.forEach(function(f){
    var sel=$("map-"+f);
    mapping[f]=sel?parseInt(sel.value):-1;
  });
  /* ★ 保存列映射到 localStorage，下次打开自动恢复 ★ */
  var sheetSel=$("import-sheet-select");
  if(sheetSel)mapping._sheet=sheetSel.value;
  try{localStorage.setItem("wb_prod_import_mapping",JSON.stringify(mapping))}catch(e){}
  if(mapping.group<0){toast("请选择组别列");return}
  if(mapping.product<0){toast("请选择产品名称列");return}
  if(mapping.planned<0){toast("请选择计划数量列");return}
  var replace=$("import-replace")?$("import-replace").checked:false;
  var newOrders=[];
  var imported=0;
  /* ★ 导入去重表：同一(product+group)只保留一条 ★ */
  var importDedup={};
  if(!replace){
    /* 追加模式：保留旧的非完成订单，并把它们登记进去重表（旧的优先，新的重复项跳过） */
    var keepOrders=state.schedule.filter(function(s){return s.status!=="已完成"});
    keepOrders.forEach(function(s){importDedup[dedupKey3(s)]=true});
    newOrders=keepOrders;
  }
  /* 核心：基于G列(备注列)标题文字检测分类区域
   * ★ G列固定为第6列(索引6)，不受用户"备注"列映射影响
   * 用户映射的 mapping.notes 可能指向其他列（如D列"备注国家"），但G列才是真正的业务备注列 */
  var notesCol=6; /* ★ G列固定索引，始终用真正的G列做区块检测和备注解析 */
  var sections=detectExcelSections(importData,notesCol);
  console.log("[导入] 检测到 "+sections.length+" 个分类区域:",sections.map(function(s){return s.label+"("+s.key+")["+s.start+"-"+s.end+"]"}).join(" | "));
  /* 收集所有区块标题行索引，主循环中跳过（标题行落在区块缝隙里，getRowSection 返回 null 会混入默认分类） */
  var headerRowSet={};
  sections.forEach(function(s){if(s.headerRow>=0)headerRowSet[s.headerRow]=true});
  for(var i=1;i<importData.length;i++){
    var row=importData[i];
    if(!row)continue;
    /* ★ 跳过区块标题行（G列含"各组XX"的那一行）★ */
    if(headerRowSet[i])continue;
    var product=mapping.product>=0?String(row[mapping.product]||"").trim():"";
    if(!product)continue;
    /* ★ 跳过子表头行（产品列内容为"品名"/"工单号"等列标题文字）★ */
    if(HEADER_PRODUCT_WORDS.indexOf(product)>=0)continue;
    /* 基础字段提取 */
    var rawGroup=mapping.group>=0?row[mapping.group]:"";
    var group=normalizeGroup(rawGroup);
    var planned=mapping.planned>=0?parseInt(row[mapping.planned])||0:0;
    var rawActual=mapping.actual>=0?parseInt(row[mapping.actual])||0:0;
    var actual=rawActual<0?planned+rawActual:rawActual;
    var unit=mapping.unit>=0?String(row[mapping.unit]||"").trim()||"pcs":"pcs";
    var needFilm=mapping.needFilm>=0?normalizeBool(row[mapping.needFilm]):false;
    var startDate=mapping.startDate>=0?normalizeDate(row[mapping.startDate]):todayStr();
    var endDate=mapping.endDate>=0?normalizeDate(row[mapping.endDate]):startDate;
    var orderType=mapping.orderType>=0?normalizeOrderType(row[mapping.orderType]):"正常单";
    var status=mapping.status>=0?normalizeStatus(row[mapping.status]):"待排产";
    var notes=notesCol>=0?String(row[notesCol]||"").trim():"";
    var orderNo=mapping.orderNo>=0?String(row[mapping.orderNo]||"").trim():"";
    /* ★ 工单号fallback：如果没映射工单号列，自动尝试A列(第0列) ★ */
    if(!orderNo&&row[0])orderNo=String(row[0]||"").trim();
    var model=mapping.model>=0?String(row[mapping.model]||"").trim():"";
    /* ★ 型号fallback：如果没映射型号列，自动尝试C列(第2列) ★ */
    if(!model&&row[2])model=String(row[2]||"").trim();
    /* ★★★ 核心：从G列(备注)解析组别+详情 ★★★ */
    var notesDetail=parseNotesForGroupAndDetails(notes);
    /* 如果G列解析出了组别，优先使用（比组别列更准确） */
    if(notesDetail.group){group=notesDetail.group}
    /* 兜底：如果G列和组别列都没得到组别，标记为"未分组"（避免丢失数据） */
    if(!group){group="未分组";console.log("[导入] 第"+i+"行未识别到组别(G列='"+notes+"' product='"+product+"')，归入未分组")}
    /* G列解析出的过膜/够数标记，覆盖原有判断 */
    if(notesDetail.needFilm){needFilm=true}
    /* ★★★ 从所在区域标题确定分类(category) ★★★ */
    var section=getRowSection(i,sections);
    var cat=section?section.key:"production"; /* 默认归入今日排产 */
    var regionIndex=section?sections.indexOf(section):-1;
    var isAbnormal=(cat==="abnormal");
    if(cat==="abnormal"&&!notesDetail.isAbnormalNote){notesDetail.isAbnormalNote=true}/* 异常区域全部标记 */
    if(cat==="shortage"){
      /* ★ 欠数区域：实际 = 计划 + G列欠数(负数)
       * 例：E列=3000, G列="A -3" → actual = 3000 + (-3) = 2997, 真正欠数为 -3 ★ */
      if(notesDetail.shortageQty<0){actual=planned+notesDetail.shortageQty}
      status="生产中";
    }
    /* 从Excel单元格格式自动识别：粗体→急单，红色→已领料齐套 */
    var materialStatus="receiving"; /* 默认：正在领料 */
    if(importCellStyles&&importCellStyles[i]&&mapping.product>=0){
      var productStyle=importCellStyles[i][mapping.product]||{bold:false,red:false};
      /* 检测整行是否有bold/red（有些Excel只给某列设置了格式） */
      var rowHasBold=false,rowHasRed=false;
      for(var sc=0;sc<importCellStyles[i].length;sc++){
        var cs=importCellStyles[i][sc];
        if(cs&&cs.bold)rowHasBold=true;
        if(cs&&cs.red)rowHasRed=true;
      }
      if(rowHasBold)orderType="急单";
      if(rowHasRed)materialStatus="ready";
    }
    /* 产品名或备注含"过膜"也标记为需过膜 */
    var productStr=product.toLowerCase();
    if(!needFilm&&(productStr.indexOf("过膜")>=0||productStr.indexOf("覆膜")>=0)){needFilm=true}
    /* 分类已由区域标题确定(cat)，不再用硬编码regionIndex猜测 */
    /* G列(备注)含"领料"关键词的额外校验（兜底） */
    if(notes.indexOf("领料")>=0&&cat==="production"){cat="pickup_today"}
    /* 异常工单不自动标完成——需要人工确认解决 */
    if(!isAbnormal&&actual>0&&actual>=planned&&status!=="已完成")status="已完成";
    else if(actual>0&&status==="待排产")status="生产中";
    /* ★ 去重检查：必须 工单单号+名称+型号 三样都相同才算重复（后导入的覆盖先前的）★
     * 防止 product+group 太粗把"同名不同单"误删 */
    var dedupKey=orderNo+"|"+product+"|"+model;
    if(importDedup[dedupKey]){console.log("[导入去重] 跳过重复: "+dedupKey);continue}
    importDedup[dedupKey]=true;
    newOrders.push({
      id:genId(),orderNo:orderNo,model:model,group:group,orderType:orderType,product:product,
      planned:planned,actual:actual,unit:unit,needFilm:needFilm,
      startDate:startDate,endDate:endDate,status:status,
      isAbnormal:isAbnormal,abnormalReason:isAbnormal?(notesDetail.situation||notes||"来自Excel异常区域"):"",solution:"",arrivalDate:"",
      situation:notesDetail.situation,

      materialStatus:"receiving",regionIndex:regionIndex,category:cat,

    });

  }
  /* ★ 彻底刷新：重建完工记录，只保留本次导入中已完成的订单，三重去重，不残留旧数据 ★
   * 不再调用 moveMissingToCompleted / mergeCompleted（避免旧Excel消失的订单永久残留） */
  var completedFromImport=newOrders.filter(function(s){return s.status==="已完成"});

  });

  state.schedule=newOrders.filter(function(s){return s.status!=="已完成"});
  /* ★ 导入诊断：各区块抓取统计 + 详细调试信息 */

  /* 收集G列前20行原始值（用于诊断区块检测） */
  var gColSamples=[];
  for(var gi=0;gi<Math.min(20,importData.length);gi++){
    var rv=importData[gi];
    gColSamples.push(rv?(notesCol>=0&&rv[notesCol]!==undefined?String(rv[notesCol]):"[col"+notesCol+"不存在]"): "[空行]");
  }
  console.log("[导入诊断] 各区块统计:",diag,"异常工单:",abnormalRowsDebug.length+"条");
  console.log("[导入诊断] G列前20行:",gColSamples);
  console.log("[导入诊断] 检测到区块:",sections.map(function(s){return s.label+"["+s.start+"-"+s.end+"]"}));
  state.lastImportDiag={
    categoryCount:diag,
    sectionsDetected:sections.map(function(s){return{label:s.label,key:s.key,start:s.start+1,end:s.end,headerRow:s.headerRow}}),
    notesCol:notesCol,
    gColSamples:gColSamples,
    abnormalRowsDebug:abnormalRowsDebug
  };
  saveData("schedule");
  closeImportModal();
  /* 自动检测并导入「今明后天计划」工作表的今天计划 */
  var tpOk=autoImportTodayPlan();
  renderSchedule();renderToday();renderLog();
  var msg="成功导入 "+imported+" 条排产数据";
  if(state.completed.length>0)msg+="，累计完工 "+state.completed.length+" 条";
  if(tpOk)msg+="，今天计划基准 "+state.todayplan.length+" 条";
  /* 显示各区块抓取数量 */
  var abnCount=newOrders.filter(function(s){return s.isAbnormal}).length;
  if(abnCount>0)msg+="，⚠️异常工单 "+abnCount+" 条";
  else if(diag.abnormal)msg+="（异常区0条，请检查Excel格式）";
  toast(msg);
  }catch(err){
    console.error("confirmImport error:",err);
    toast("导入失败:"+(err&&err.message||err)+" (请截图发给小台)");
  }
}

/* ===== 今明后天计划表解析（替代旧版月度计划导入） ===== */
/*
 * Excel 中「今明后天计划」工作表结构：
 *   表内按行分为 3 个分区（类似生产任务的 G 列标题分区）：
 *     - 今天计划（标题行含"今天计划"）
 *     - 明天计划（标题行含"明天计划"）
 *     - 后天计划（标题行含"后天计划"）
 *   每个分区下有 ABCE 各组的明细数据
 *
 * 导入生产任务表后，自动检测并解析此表，仅提取【今天计划】作为实时完成对比基准
 */
var TODAYPLAN_SECTIONS=[
  {key:"today",    label:"今天计划", keywords:["今天计划","今日计划","今日","今天"]},
  {key:"tomorrow", label:"明天计划", keywords:["明天计划","明日计划","明日","明天"]},
  {key:"dayafter", label:"后天计划", keywords:["后天计划","后日计划","后日","后天"]}
];

function detectTodayPlanSections(rows, notesCol){
  /* 与 detectExcelSections 相同逻辑，但用 TODAYPLAN_SECTIONS 关键词 */
  var sections=[];
  var currentSection=null;
  var candidateCols=notesCol>=0?[notesCol]:[6];
  /* 多列兜底扫描 */
  if(rows.length>0&&rows[0]){
    for(var ci=0;ci<rows[0].length;ci++){if(candidateCols.indexOf(ci)<0)candidateCols.push(ci)}
  }
  for(var i=1;i<rows.length;i++){
    var row=rows[i]; if(!row)continue;
    var matched=null;
    for(var ci=0;ci<candidateCols.length;ci++){
      var val=String(row[candidateCols[ci]]||"").trim();
      if(!val)continue;
      if(val.indexOf("各组")!==0)continue;
      for(var s=0;s<TODAYPLAN_SECTIONS.length;s++){
        var sp=TODAYPLAN_SECTIONS[s];
        for(var k=0;k<sp.keywords.length;k++){
          if(val.indexOf(sp.keywords[k])>=0){matched=sp;break}
        }
        if(matched)break
      }
      if(matched)break
    }
    if(matched){
      if(currentSection){currentSection.end=i;sections.push(currentSection)}
      currentSection={key:matched.key,label:matched.label,start:i+1,end:rows.length,headerRow:i};
    }
  }
  if(currentSection){currentSection.end=rows.length;sections.push(currentSection)}
  return sections;
}

function getTodayPlanRow(idx, sections){
  for(var si=0;si<sections.length;si++){
    var s=sections[si];
    if(idx>=s.start&&idx<s.end)return s
  }
  return null
}

/* 从已加载的Excel中自动检测并导入「今明后天计划」工作表的今天计划数据 */
function autoImportTodayPlan(){
  var sheets=importXlsxSheets||[];
  if(sheets.length<=1)return false; /* 只有一个表，没有今明后天计划表 */
  /* 查找名称含"今明后"或"计划"的工作表（排除当前正在导入的生产任务表） */
  var planSheet=null;
  for(var si=0;si<sheets.length;si++){
    var s=sheets[si];
    var name=(s.name||"").trim();
    if(name.indexOf("今明后")>=0||name.indexOf("今天")>=0||(name.indexOf("计划")>=0&&name.indexOf("生产任务")<0)){
      planSheet=s;break
    }
  }
  if(!planSheet){
    console.log("[todayplan] 未检测到「今明后天计划」工作表，跳过");
    return false
  }
  try{
    var parsed=parseSheetRows(importXlsxFiles,importXlsxSharedStrings,planSheet.path);
    var rows=parsed.rows||[];
    if(rows.length<2){
      console.log("[todayplan] 「"+planSheet.name+"」数据不足");return false
    }
    /* 自动映射列 */
    var headers=rows[0].map(function(c,i){return c||getColLetter(i)});
    var map={};
    var tpFields=[
      {key:"orderNo",keywords:["单号","order","no"]},
      {key:"group",keywords:["组","组别","group"],defaultCol:6},
      {key:"product",keywords:["产品","品名","名称","product"]},
      {key:"model",keywords:["型号","model"]},
      {key:"planned",keywords:["计划","数量","plan"]},
      {key:"unit",keywords:["单位","unit"]},
      {key:"notes",keywords:["备注","note","说明","规格"],defaultCol:6}
    ];
    tpFields.forEach(function(f){
      var found=-1;
      for(var i=0;i<headers.length;i++){
        var hdr=String(headers[i]).toLowerCase();
        for(var k=0;k<f.keywords.length;k++){if(hdr.indexOf(f.keywords[k].toLowerCase())>=0){found=i;break}}
        if(found>=0)break
      }
      if(found<0&&f.defaultCol!==undefined)found=f.defaultCol;
      map[f.key]=found
    });
    var notesCol=6; /* ★ G列固定索引，所有备注/区块检测统一用G列 */
    var sections=detectTodayPlanSections(rows,notesCol);
    console.log("[todayplan] 「"+planSheet.name+"」检测到 "+sections.length+" 个日期区域:",sections.map(function(s){return s.label}));
    /* 只提取今天计划区域的数据 */
    var todaySec=null;
    for(var si=0;si<sections.length;si++){if(sections[si].key==="today"){todaySec=sections[si];break}}
    if(!todaySec){
      console.log("[todayplan] 未找到「今天计划」区域");return false
    }
    var entries=[];
    for(var i=todaySec.start;i<todaySec.end;i++){
      var row=rows[i];if(!row)continue;
      var product=map.product>=0?String(row[map.product]||"").trim():"";
      if(!product)continue;
      var orderNo=map.orderNo>=0?String(row[map.orderNo]||"").trim():"";
      var rawGroup=map.group>=0?row[map.group]:"";
      var group=normalizeGroup(rawGroup);
      var planned=map.planned>=0?parseInt(row[map.planned])||0:0;
      var model=map.model>=0?String(row[map.model]||"").trim():"";
      var unit=map.unit>=0?String(row[map.unit]||"").trim()||"pcs":"pcs";
      var notes=notesCol>=0?String(row[notesCol]||"").trim():"";
      /* G列解析组别（与生产任务相同规则） */
      var nd=parseNotesForGroupAndDetails(notes);
      if(nd.group)group=nd.group;
      entries.push({
        id:genId(),orderNo:orderNo,group:group,product:product,model:model,
        planned:planned,unit:unit,notes:notes,
        needFilm:nd.needFilm,isEnough:nd.isEnough,shortageQty:nd.shortageQty,
        sheetName:planSheet.name,importedAt:Date.now()
      });
    }
    state.todayplan=entries;
    saveAll();
    console.log("[todayplan] 已导入今天计划 "+entries.length+" 条");
    return true
  }catch(e){
    console.error("[todayplan] 解析失败:",e);return false
  }
}

function formatTime(ts){
  var d=new Date(ts);
  var now=new Date();
  var h=d.getHours(),m=d.getMinutes();
  var hm=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  if(d.toDateString()===now.toDateString())return "今天 "+hm;
  var y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  if(d.toDateString()===y.toDateString())return "昨天 "+hm;
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}

function reimportFromCurrentData(){

  importMapping={};
  var fields2=[
    {key:"group",keywords:["组","组别","group"],defaultCol:6},
    {key:"product",keywords:["产品","品名","名称","产品名","product","型号"]},
    {key:"planned",keywords:["计划","计划数","计划量","plan","数量"]},
    {key:"actual",keywords:["实际","完成","actual","已完成"]},
    {key:"unit",keywords:["单位","unit"]},
    {key:"needFilm",keywords:["过膜","film","覆膜"]},
    {key:"startDate",keywords:["开始","start","开工"]},
    {key:"endDate",keywords:["结束","交期","end","截止","完成日期"]},
    {key:"orderType",keywords:["类型","type","急单","priority"]},
    {key:"status",keywords:["状态","status","进度"]},
    {key:"notes",keywords:["备注","note","说明","remark","规格","G列"],defaultCol:6}
  ];
  fields2.forEach(function(f){

      var header=String(importHeaders[i]).toLowerCase();
      for(var k=0;k<f.keywords.length;k++){
        if(header.indexOf(f.keywords[k].toLowerCase())>=0){found=i;break}
      }
      if(found>=0)break;
    }
    if(found<0&&f.defaultCol!==undefined)found=f.defaultCol;
    importMapping[f.key]=found;
  });
  /* Build mapping and import directly (replace all) */
  var mapping={};
  ["group","product","planned","actual","unit","needFilm","startDate","endDate","orderType","status","notes","orderNo","model"].forEach(function(f){
    mapping[f]=importMapping[f]!==undefined?importMapping[f]:-1;
  });
  if(mapping.group<0||mapping.product<0||mapping.planned<0){toast("自动列映射失败，请重新导入并手动指定列");return}
  var newOrders=[];
  var imported=0;
  /* ★ 三重去重表（条件1:工单单号 + 条件2:品名 + 条件3:型号），三样必须完全相同才算重复 ★ */
  var refreshDedup={};
  var productCol=mapping.product;
  var notesCol=6; /* ★ G列固定索引，始终用真正的G列做区块检测和备注解析 */
  var sections=detectExcelSections(importData,notesCol);
  console.log("[刷新] 检测到 "+sections.length+" 个分类区域");
  /* 跳过区块标题行和子表头行（与 confirmImport 相同逻辑） */
  var headerRowSet2={};
  sections.forEach(function(s){if(s.headerRow>=0)headerRowSet2[s.headerRow]=true});
  var tm=addDays(1); /* 明天日期 */
  for(var i=1;i<importData.length;i++){
    var row=importData[i];
    if(!row)continue;
    if(headerRowSet2[i])continue;
    var product=mapping.product>=0?String(row[mapping.product]||"").trim():"";
    if(!product)continue;
    if(HEADER_PRODUCT_WORDS.indexOf(product)>=0)continue;
    var group=normalizeGroup(mapping.group>=0?row[mapping.group]:"");
    var planned=mapping.planned>=0?parseInt(row[mapping.planned])||0:0;
    var rawActual=mapping.actual>=0?parseInt(row[mapping.actual])||0:0;
    var actual=rawActual<0?planned+rawActual:rawActual;
    var unit=mapping.unit>=0?String(row[mapping.unit]||"").trim()||"pcs":"pcs";
    var needFilm=mapping.needFilm>=0?normalizeBool(row[mapping.needFilm]):false;
    var startDate=mapping.startDate>=0?normalizeDate(row[mapping.startDate]):todayStr();
    var endDate=mapping.endDate>=0?normalizeDate(row[mapping.endDate]):startDate;
    var orderType=mapping.orderType>=0?normalizeOrderType(row[mapping.orderType]):"正常单";
    var status=mapping.status>=0?normalizeStatus(row[mapping.status]):"待排产";
    /* ★ 备注统一用G列(第6列)，不依赖用户映射 ★ */
    var notes=String(row[6]||"").trim();
    var orderNo=mapping.orderNo>=0?String(row[mapping.orderNo]||"").trim():"";
    /* ★ 工单号fallback：如果没映射工单号列，自动尝试A列(第0列) ★ */

    /* ★ 型号fallback：如果没映射型号列，自动尝试C列(第2列) ★ */
    if(!model&&row[2])model=String(row[2]||"").trim();
    /* G列解析组别和分类（与confirmImport相同逻辑） */
    var notesDetail=parseNotesForGroupAndDetails(notes);

    if(notesDetail.needFilm){needFilm=true}
    var section=getRowSection(i,sections);
    var cat=section?section.key:"production";

    var isAbnormal=(cat==="abnormal");
    if(cat==="abnormal"&&!notesDetail.isAbnormalNote){notesDetail.isAbnormalNote=true}/* 异常区域全部标记 */
    if(cat==="shortage"){
      /* ★ 欠数区域：实际 = 计划 + G列欠数(负数)，与 confirmImport 保持一致 ★ */
      if(notesDetail.shortageQty<0){actual=planned+notesDetail.shortageQty}
      status="生产中";
    }
    /* Excel格式自动识别 */
    var materialStatus="receiving";
    if(importCellStyles&&importCellStyles[i]&&productCol>=0){
      var rowHasBold=false,rowHasRed=false;
      for(var sc=0;sc<importCellStyles[i].length;sc++){
        var cs=importCellStyles[i][sc];

        if(cs&&cs.red)rowHasRed=true;
      }

      if(rowHasRed)materialStatus="ready";

    /* 产品名或备注含"过膜"也标记为需过膜 */
    var productStr=product.toLowerCase();
    if(!needFilm&&(productStr.indexOf("过膜")>=0||productStr.indexOf("覆膜")>=0)){needFilm=true}
    if(notes.indexOf("领料")>=0&&cat==="production"){cat="pickup_today"}
    /* 异常工单不自动标完成 */
    if(!isAbnormal&&actual>0&&actual>=planned&&status!=="已完成")status="已完成";
    else if(actual>0&&status==="待排产")status="生产中";
    /* ★ 三重去重（工单号+品名+型号），三样都相同才跳过，避免重复数据 ★ */
    var dedupKey=orderNo+"|"+product+"|"+model;
    if(refreshDedup[dedupKey]){console.log("[刷新去重] 跳过重复: "+dedupKey);continue}
    refreshDedup[dedupKey]=true;
    newOrders.push({
      id:genId(),orderNo:orderNo,model:model,group:group,orderType:orderType,product:product,
      planned:planned,actual:actual,unit:unit,needFilm:needFilm,
      startDate:startDate,endDate:endDate,status:status,
      isAbnormal:isAbnormal,abnormalReason:isAbnormal?(notesDetail.situation||notes||"来自Excel异常区域"):"",solution:"",arrivalDate:"",
      situation:notesDetail.situation,
      notes:notes,sortOrder:imported+1,createdAt:Date.now(),imported:true,
      materialStatus:"receiving",regionIndex:regionIndex,category:cat,
      shortageQty:notesDetail.shortageQty,isEnough:notesDetail.isEnough
    });
    imported++;
  }
  /* ★ 彻底刷新：完全清空历史数据，只保留本次Excel导入的内容，绝不残留旧数据 ★
   * 1. 完工记录(completed) 由本次导入中 status="已完成" 的订单重建，并按「工单号+品名+型号」三重去重
   * 2. 排产表(schedule) 只保留非完成订单
   * 不再调用 moveMissingToCompleted / mergeCompleted（它们会把旧Excel中消失的订单永久残留为"之前的数据"） */
  var completedFromImport=newOrders.filter(function(s){return s.status==="已完成"});
  var seenC={};
  state.completed=completedFromImport.filter(function(s){
    var k=dedupKey3(s);
    if(seenC[k])return false;
    seenC[k]=true;
    return true;
  });
  /* Keep only non-completed orders in active schedule */
  state.schedule=newOrders.filter(function(s){return s.status!=="已完成"});
  /* Update timestamp */
  localStorage.setItem(KEYS.lastFileTime,Date.now().toString());
  saveData("schedule");
  /* 自动检测并导入今天计划基准 */
  autoImportTodayPlan();
  renderSchedule();renderToday();renderLog();
  toast("已刷新，共 "+imported+" 条排产数据"+(state.todayplan.length>0?"，今天计划 "+state.todayplan.length+" 条":""));
}

/* ===== 手机同步 ===== */
function getSyncStatus(){
  if(state.schedule.length===0)return "empty";
  if(wb_syncFromSeed)return "cloud";
  return "local";
}
function updateSyncBadge(){
  var badge=$("sync-badge");if(!badge)return;
  var status=getSyncStatus();
  badge.className="sync-badge "+status;
  if(status==="local")badge.textContent="本地数据";
  else if(status==="cloud")badge.textContent="云端同步";
  else badge.textContent="无数据";
  badge.title=status==="local"?"数据仅在当前设备，点击「同步到手机」推送到手机":
    status==="cloud"?"数据来自云端同步，多设备数据一致":
    "请先导入Excel数据";
}
function syncToPhone(){
  if(state.schedule.length===0){toast("没有数据可同步，请先导入Excel");return}
  /* ★ 方案1：尝试通过URL哈希分享（手机打开同一链接即可加载数据）★ */
  var exportData={schedule:state.schedule,completed:state.completed,tasks:state.tasks,logs:state.logs,todayplan:state.todayplan};
  var json=JSON.stringify(exportData);
  try{
    var compressed=LZString.compressToEncodedURIComponent(json);
    var base=location.origin+location.pathname;
    var url=base+"#d="+compressed;
    if(url.length<=8000){
      /* 数据量适中：复制完整链接，手机打开即可 */
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){
          toast("✅ 同步链接已复制！\n📱 手机浏览器打开此链接即可看到相同数据");
        }).catch(function(){fallbackCopy(url);toast("链接已复制，手机浏览器打开即可")});
      }else{
        fallbackCopy(url);
        toast("链接已复制，手机浏览器打开即可");
      }
      return;
    }
  }catch(e){}
  /* ★ 方案2：数据太大 → 生成自带数据的独立HTML文件（手机浏览器直接打开即可查看完整工作台）★ */
  var htmlContent=generateStandaloneHTML(exportData);
  var blob=new Blob([htmlContent],{type:"text/html;charset=utf-8"});
  var fileName="生产工作台_"+todayStr()+".html";
  /* 直接下载（创建隐藏<a>触发） */
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download=fileName;
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
  toast("⬇️ 已下载："+fileName+"\n📱 发送到手机后用浏览器打开即可查看完整工作台");
}
